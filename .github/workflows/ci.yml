name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install PySide6-Essentials pillow
      - name: Syntax check
        run: python -m py_compile launcher/core.py launcher/mh3u_launcher_qt.py launcher/updater.py tools/make_release.py tools/publish_release.py
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
